version: 2.1

jobs:
  build:
    macos:
      xcode: 27.2.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          command: fastlane unitTestsiOS scheme:"SwrveSDKiOS" device:"iPhone 17 (27.2)"
          no_output_timeout: 30m
      - run: fastlane unitTeststvOS scheme:"SwrveSDKTesttvOS"
      - store_test_results:
          path: fastlane/test_output/

workflows:
  build_and_test:
    jobs:
      - build
